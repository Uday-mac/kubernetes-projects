apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster-ingress
  region: us-east-1
  tags:
    Project: demo-ingress

availabilityZones:
  - us-east-1a
  - us-east-1b

iam:
  withOIDC: true

managedNodeGroups:
  - name: workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    privateNetworking: true
    volumeSize: 20
    iam:
      withAddonPolicies:
        ebs: false
        albIngress: true
    labels:
      lifecycle: ec2-autoscaler
