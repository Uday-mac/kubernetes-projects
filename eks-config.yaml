apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-cluster-sts
  region: us-east-1
  tags:
    Project: demo 

availabilityZones:
  - us-east-1a
  - us-east-1b
  - us-east-1c

iam:
  withOIDC: true

managedNodeGroups:
  - name: workers
    instanceType: t3.small
    desiredCapacity: 4
    minSize: 4
    maxSize: 5
    privateNetworking: true
    volumeSize: 20
    iam:
      withAddonPolicies:
        ebs: true
    labels:
      lifecycle: ec2-autoscaler
