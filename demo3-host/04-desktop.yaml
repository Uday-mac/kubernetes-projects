apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktop-deploy
  namespace: app1-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: desktop
  template:
    metadata:
      labels:
        app: desktop
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone 
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: desktop
      containers:
      - name: desktop-container
        image: python:alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /desktop && echo '<html>
              <head><title>desktop Users</title></head>
              <body>
                <h1>desktop Users</h1>
                <p>Welcome to Cloud With VarJosh</p>
              </body>
            </html>' > /index.html && cd / && python3 -m http.server 5678
        ports:
        - containerPort: 5678

---
kind: Service
apiVersion: v1
metadata:
  name: desktop-svc
  namespace: app1-ns
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /index.html
spec:
  selector:
    app: desktop
  ports:
  - name: desktop-port
    port:  80
    targetPort: 5678
    protocol: TCP
